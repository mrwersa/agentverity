name: Evidence gate demo

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  payment-dispute-router:
    name: Payment dispute router
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AgentVerity
        run: python -m pip install -e .
      - name: Run the evidence gate
        run: |
          python examples/payment_dispute_gate.py \
            --output-dir evidence-gate-reports
      - name: Lead the job summary with the gate result
        # The detailed JUnit reports below are useful but dense. This puts the
        # actual finding at the top of the summary, in the same Markdown the
        # README carries, so both surfaces say the same thing.
        run: |
          {
            echo "# AgentVerity evidence gate"
            echo
            echo "The same payment-dispute router against two probe sets."
            echo "Both score 6/6 on the exact-match evaluator. Only one earns"
            echo "a baseline."
            echo
            python examples/payment_dispute_gate.py --markdown | sed -n '/^|/,$p'
            echo
            echo "Full JUnit reports follow."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Narrow probes - baseline refused
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280
        if: ${{ !cancelled() }}
        with:
          name: Narrow probes - baseline refused
          path: evidence-gate-reports/narrow-*.xml
          reporter: java-junit
          fail-on-error: "false"
          collapsed: never
          list-tests: all
          report-title: "Full JUnit report: narrow probe set (REFUSED)"
      - name: Repaired probes - baseline admitted
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280
        if: ${{ !cancelled() }}
        with:
          name: Repaired probes - baseline admitted
          path: evidence-gate-reports/repaired-*.xml
          reporter: java-junit
          collapsed: never
          list-tests: all
          report-title: "Full JUnit report: repaired probe set (ADMITTED)"
