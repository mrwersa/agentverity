<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690"
 viewBox="0 0 1200 690" role="img"
 aria-label="AgentVerity release gate from a real AgentCore payment-routing canary">
<style>
  .bg { fill: #0b1220; }
  .card { fill: #111b2e; stroke: #314158; stroke-width: 1.5; }
  .step { fill: #17243a; stroke: #426286; stroke-width: 1.5; }
  text { font-family: Arial, sans-serif; }
  .headline { fill: #f8fafc; font-size: 29px; font-weight: 700; }
  .subhead { fill: #9fb0c7; font-size: 16px; font-weight: 400; }
  .stepText { fill: #dbeafe; font-size: 15px; font-weight: 600;
    text-anchor: middle; }
  .eyebrow { fill: #91a4bf; font-size: 13px; font-weight: 700; }
  .metric { fill: #f8fafc; font-size: 31px; font-weight: 700; }
  .detail { fill: #cbd5e1; font-size: 16px; font-weight: 400; }
  .badge { fill: #07111f; font-size: 13px; font-weight: 700;
    text-anchor: middle; }
  .flow { stroke: #64748b; stroke-width: 2; }
  .lessonBox { fill: #182337; stroke: #f59e0b; stroke-width: 1.5; }
  .lessonTitle { fill: #fbbf24; font-size: 13px; font-weight: 700; }
  .lesson { fill: #e2e8f0; font-size: 17px; font-weight: 600; }
  .footer { fill: #73849c; font-size: 13px; font-weight: 400; }
</style>
<rect width="1200" height="690" class="bg"/>
<text x="54" y="52" class="headline">A green agent test, qualified before release.</text>
<text x="54" y="82" class="subhead">Real payment-routing canary · Strands + Nova Micro + AgentCore Runtime</text>
<rect x="54" y="112" width="238" height="52" rx="6" class="step"/>
<rect x="357" y="112" width="238" height="52" rx="6" class="step"/>
<rect x="660" y="112" width="238" height="52" rx="6" class="step"/>
<rect x="963" y="112" width="183" height="52" rx="6" class="step"/>
<text x="173" y="144" class="stepText">6 REVIEWED CASES</text>
<text x="476" y="144" class="stepText">DEEPEVAL QUALITY</text>
<text x="779" y="144" class="stepText">AGENTVERITY EVIDENCE</text>
<text x="1055" y="144" class="stepText">RELEASE</text>
<line x1="309" y1="138" x2="337" y2="138" class="flow"/>
<path d="M 337 133 L 347 138 L 337 143 z" fill="#64748b"/>
<line x1="612" y1="138" x2="640" y2="138" class="flow"/>
<path d="M 640 133 L 650 138 L 640 143 z" fill="#64748b"/>
<line x1="915" y1="138" x2="943" y2="138" class="flow"/>
<path d="M 943 133 L 953 138 L 943 143 z" fill="#64748b"/>
<text x="54" y="209" class="subhead">78 isolated cloud calls · London (eu-west-2) · amazon.nova-micro-v1:0</text>
<rect x="54" y="244" width="344" height="250" rx="8" class="card"/>
<rect x="54" y="244" width="344" height="5" rx="2" fill="#38bdf8"/>
<text x="80" y="286" class="eyebrow">QUALITY · DEEPEVAL</text>
<text x="80" y="338" class="metric">6 / 6 correct</text>
<text x="80" y="382" class="detail">Reviewed route labels</text>
<text x="80" y="414" class="detail">Correctness checked once per case</text>
<rect x="80" y="446" width="192" height="30" rx="4" fill="#38bdf8"/>
<text x="176" y="467" class="badge">QUALITY PASSED</text>
<rect x="428" y="244" width="344" height="250" rx="8" class="card"/>
<rect x="428" y="244" width="344" height="5" rx="2" fill="#4ade80"/>
<text x="454" y="286" class="eyebrow">EVIDENCE · AGENTVERITY</text>
<text x="454" y="338" class="metric">0 / 36 flips</text>
<text x="454" y="382" class="detail">6 of 6 routes reached</text>
<text x="454" y="414" class="detail">Stable and non-blind decisions</text>
<rect x="454" y="446" width="192" height="30" rx="4" fill="#4ade80"/>
<text x="550" y="467" class="badge">BASELINE ADMITTED</text>
<rect x="802" y="244" width="344" height="250" rx="8" class="card"/>
<rect x="802" y="244" width="344" height="5" rx="2" fill="#a78bfa"/>
<text x="828" y="286" class="eyebrow">OPERATIONS · AGENTCORE</text>
<text x="828" y="338" class="metric">78 successful</text>
<text x="828" y="382" class="detail">0 errors · 0 throttles</text>
<text x="828" y="414" class="detail">End-to-end p50 5.87s</text>
<rect x="828" y="446" width="192" height="30" rx="4" fill="#a78bfa"/>
<text x="924" y="467" class="badge">CANARY HEALTHY</text>
<rect x="54" y="526" width="1092" height="98" rx="8" class="lessonBox"/>
<text x="80" y="558" class="lessonTitle">WHAT THE FIRST RUN CAUGHT</text>
<text x="80" y="590" class="lesson">Quality was 5/6 while the decision was stable.</text>
<text x="642" y="590" class="lesson">Stability cannot override correctness.</text>
<text x="54" y="662" class="footer">Redacted evidence · 2026-07-25 · runtime p50 0.576s · end-to-end p95 7.59s</text>
</svg>
