# One Promptfoo quality run becomes AgentVerity evidence without another call.
providers:
  - id: file://flaky_router.py
    label: payment-router-with-one-unstable-boundary

prompts:
  - "{{ticket}}"

tests:
  - vars:
      ticket: My card was charged twice for the same order.
    assert:
      - type: equals
        value: duplicate_charge
  - vars:
      ticket: The shop promised a refund but it has not arrived.
    assert:
      - type: equals
        value: refund_delay
  - vars:
      ticket: I do not recognise this card purchase.
    assert:
      - type: equals
        value: card_security
  - vars:
      ticket: The merchant charged more than the agreed amount.
    assert:
      - type: equals
        value: merchant_dispute
  - vars:
      ticket: Cash came out of my balance but the ATM dispensed nothing.
    assert:
      - type: equals
        value: cash_withdrawal
  - vars:
      ticket: The transfer is still pending after two days.
    assert:
      - type: equals
        value: transfer_delay
