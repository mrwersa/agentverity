[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentverity"
version = "0.1.0"
description = "Measure-first testing for non-deterministic LLM agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Saeed Aghaee" },
]
keywords = [
    "llm",
    "agent",
    "testing",
    "metamorphic-testing",
    "non-deterministic",
    "verdict-stochasticity",
    "agent-testing",
    "suite-quality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
strands = ["strands-agents>=1.0"]
langgraph = ["langgraph>=0.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
agentverity = "agentverity.cli:main"

[project.urls]
Homepage = "https://github.com/mrwersa/agentverity"
Repository = "https://github.com/mrwersa/agentverity"
Issues = "https://github.com/mrwersa/agentverity/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentverity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
