[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentverity"
version = "0.13.2"
description = "Evidence checks for regression baselines on AI agents with bounded decisions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Saeed Aghaee" },
]
keywords = [
    "llm",
    "agent",
    "testing",
    "metamorphic-testing",
    "non-deterministic",
    "verdict-stochasticity",
    "agent-testing",
    "suite-quality",
    "test-adequacy",
    "code-coverage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
strands = ["strands-agents>=1.0"]
otel = ["opentelemetry-api>=1.27,<2"]
showcase = [
    "bedrock-agentcore>=1.18,<2",
    "boto3>=1.40",
    "deepeval>=4,<5",
    "opentelemetry-api>=1.27,<2",
    "pydantic>=2,<3",
    "strands-agents>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
agentverity = "agentverity.cli:main"

[project.urls]
Homepage = "https://github.com/mrwersa/agentverity"
Repository = "https://github.com/mrwersa/agentverity"
Issues = "https://github.com/mrwersa/agentverity/issues"
Changelog = "https://github.com/mrwersa/agentverity/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mrwersa/agentverity#documentation"

[tool.hatch.build.targets.wheel]
packages = ["agentverity"]
# PEP 561: ship the marker so type checkers in consuming projects actually
# read the annotations instead of treating the package as untyped.
artifacts = ["agentverity/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
